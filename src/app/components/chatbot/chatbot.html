<!-- Bouton flottant -->
<button
  type="button"
  (click)="toggle()"
  [attr.aria-expanded]="isOpen()"
  aria-label="Ouvrir l'assistant du portfolio"
  class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-primary-600 to-accent-500 text-white shadow-lg shadow-primary-600/30 transition-transform duration-300 hover:scale-110 focus:outline-none focus:ring-4 focus:ring-primary-400/40"
>
  @if (!isOpen()) {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12a9 9 0 01-9 9c-1.36 0-2.65-.3-3.8-.85L3 21l1.85-5.2A8.96 8.96 0 013 12a9 9 0 1118 0z" />
    </svg>
  } @else {
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
    </svg>
  }
</button>

<!-- Fenêtre de chat -->
@if (isOpen()) {
  <div
    class="fixed bottom-24 right-6 z-50 flex h-[32rem] w-[min(24rem,calc(100vw-3rem))] flex-col overflow-hidden rounded-2xl border border-surface-200 bg-white shadow-2xl shadow-primary-900/20 dark:border-surface-700 dark:bg-surface-900"
    role="dialog"
    aria-label="Assistant du portfolio"
  >
    <!-- En-tête -->
    <div class="flex items-center gap-3 bg-gradient-to-r from-primary-600 to-accent-500 px-4 py-3 text-white">
      <div class="flex h-9 w-9 items-center justify-center rounded-full bg-white/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>
      <div class="leading-tight">
        <p class="text-sm font-semibold">Assistant Portfolio</p>
        <p class="flex items-center gap-1.5 text-xs text-white/80">
          <span class="inline-block h-2 w-2 rounded-full bg-green-400"></span> En ligne
        </p>
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 space-y-3 overflow-y-auto bg-surface-50 px-4 py-4 dark:bg-surface-950">
      @for (msg of messages(); track $index) {
        <div class="flex" [class.justify-end]="msg.from === 'user'">
          <div
            class="max-w-[85%] whitespace-pre-line rounded-2xl px-3.5 py-2 text-sm leading-relaxed"
            [class]="msg.from === 'user'
              ? 'bg-primary-600 text-white rounded-br-sm'
              : 'bg-white text-surface-700 shadow-sm dark:bg-surface-800 dark:text-surface-200 rounded-bl-sm'"
          >{{ msg.text }}</div>
        </div>
      }

      @if (isTyping()) {
        <div class="flex">
          <div class="flex gap-1 rounded-2xl rounded-bl-sm bg-white px-4 py-3 shadow-sm dark:bg-surface-800">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      }

      <!-- Suggestions rapides -->
      @if (!hasUserMessage()) {
        <div class="flex flex-wrap gap-2 pt-1">
          @for (s of suggestions; track s) {
            <button
              type="button"
              (click)="sendSuggestion(s)"
              class="rounded-full border border-primary-300 bg-primary-50 px-3 py-1.5 text-xs font-medium text-primary-700 transition-colors hover:bg-primary-100 dark:border-primary-700 dark:bg-primary-900/30 dark:text-primary-300 dark:hover:bg-primary-900/60"
            >{{ s }}</button>
          }
        </div>
      }

      <div #scrollAnchor></div>
    </div>

    <!-- Saisie -->
    <form
      (submit)="$event.preventDefault(); send()"
      class="flex items-center gap-2 border-t border-surface-200 bg-white px-3 py-3 dark:border-surface-700 dark:bg-surface-900"
    >
      <input
        type="text"
        [value]="input()"
        (input)="input.set($any($event.target).value)"
        placeholder="Écrivez votre message…"
        aria-label="Votre message"
        class="min-w-0 flex-1 rounded-full border border-surface-200 bg-surface-50 px-4 py-2 text-sm text-surface-800 outline-none transition-colors focus:border-primary-400 dark:border-surface-700 dark:bg-surface-800 dark:text-surface-100"
      />
      <button
        type="submit"
        [disabled]="!input().trim()"
        aria-label="Envoyer"
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary-600 text-white transition-colors hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-40"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
        </svg>
      </button>
    </form>
  </div>
}
